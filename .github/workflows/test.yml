name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ocaml-compiler:
          - 4.14.2
          - 5.2.1
          - 5.5.0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
      - name: Install from the public overlay
        run: |
          opam repository add reuna https://github.com/reuna-labs/opam-repository.git
          opam install --yes --assume-depexts dune solana cosmos tron
      - run: opam exec -- dune build @all
      - run: opam exec -- dune exec ./main.exe
